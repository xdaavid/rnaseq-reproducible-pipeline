name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  workflow:
    name: Nextflow stub integration test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.4"

      - name: Lint Nextflow source
        run: nextflow lint .

      - name: Execute complete workflow graph
        run: nextflow run main.nf -profile test -stub-run

      - name: Verify key artifacts
        run: |
          test -f results-test/matrices/transcript_counts.tsv
          test -f results-test/matrices/transcript_tpm.tsv
          test -f results-test/multiqc/multiqc_report.html
