[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-pipeline-support"
version = "1.0.0"
description = "Validation and matrix utilities for the reproducible RNA-seq pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
